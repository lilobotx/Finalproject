<!doctype html>
<html>
  <head>
    <title>Digitalt Skapande</title>
    <link rel="stylesheet" href="../style.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="../Bilder/icon.png" type="image/x-icon" />
  </head>
  <body class="main">
    <header>
      <div class="navbar">
        <nav>
          <ul class="ulnavbar">
            <li class="linavbar">
              <a href="index.html" class="nav">Main</a>
            </li>
            <li class="linavbar">
              <a href="files.html" class="nav">File Formats</a>
            </li>
            <li class="linavbar">
              <a href="displays.html" class="nav">Displays</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <div class="main_section">
      <h1>File Formats</h1>
      <div class="text_section">
        <div class="intro section">
          <h2 class="center">Compare File Formats</h2>
          <div class="CompareFlex">
            <div class="SelectedFormat">
              <h2>Selected</h2>
              <img src="../Assets/Easy.webp" alt="gd easy"/>
            </div>
            <div class="Stats">
              <h2>Stats</h2>
              <div class="Statelement">
                <div class="StatText"><h3>Max Quality</h3><h3 style="text-align: right;" id="MaxQualityStat">100/100</h3></div>
                <div class="Progessbar">
                  <div class="Progessbarfill"></div>
                  <div class="CompareFlex"></div>
                </div>
              </div>
                            <div class="Statelement">
                <div class="StatText"><h3>Efficiency</h3><h3 style="text-align: right;" id="MaxQualityStat">100/100</h3></div>
                <div class="Progessbar">
                  <div class="Progessbarfill"></div>
                  <div class="CompareFlex"></div>
                </div>
              </div>
                            <div class="Statelement">
                <div class="StatText"><h3>File Size</h3><h3 style="text-align: right;" id="MaxQualityStat">100/100</h3></div>
                <div class="Progessbar">
                  <div class="Progessbarfill"></div>
                  <div class="CompareFlex"></div>
                </div>
              </div>
                            <div class="Statelement">
                <div class="StatText"><h3>Compatibility</h3><h3 style="text-align: right;" id="MaxQualityStat">100/100</h3></div>
                <div class="Progessbar">
                  <div class="Progessbarfill"></div>
                  <div class="CompareFlex"></div>
                </div>
              </div>
                <p>
                  This is the compatibility of the format. It shows how many
                  devices and software can open the format.
                </p>
              </div>
            </div>
          </div>
          <div class="flexbuttongrid">
            <button id="PNGbutton">
              <img
                src="../Assets/PNG.png"
                alt="Image that shows off the PNG format. PNG Grapich with shapes and stuff"
                width="128px"
              />
            </button>
            <button id="JPGbutton">
              <img
                src="../Assets/JPG.jpg"
                alt="Image that shows off the Jpeg format. Shit quality image of IQ to High?"
                width="128px"
              />
            </button>
            <button id="GIFbutton">
              Gif<img
                src="../Assets/GIF.gif"
                alt="Image that shows off the GIF format. Doorbell Chud Gem Alert"
                width="128px"
              />
            </button>
            <button id="MP4button">
              MP4
              <video
                autoplay
                loop
                src="../Assets/hadi-shatter.mp4"
                width="128px"
              ></video>
            </button>
            <button id="WEBPButton">
              <img src="../Assets/WebP.webp" alt="Format 1" width="128px" />
            </button>
            <button id="SVGButton">
              <img
                src="../Assets/SVG.svg"
                alt="Image that shows off the SVG format. File with SVG on it"
                width="128px"
              />
            </button>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <div>
        <p>Lilobotx</p>
      </div>
    </footer>
  </body>
</html>
